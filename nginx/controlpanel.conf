# Reverse proxy for the control panel. Terminates basic auth and forwards everything to
# controlpanel over the internal alphaess-net -- nginx itself has no Docker socket access, so
# a bug or auth bypass in nginx cannot reach Docker; only controlpanel's fixed API surface is
# reachable from here. See DEPLOY.md, "Control panel".
server {
    listen 80;

    auth_basic "alphaess-collector control panel";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Docker's embedded DNS server, on every user-defined bridge network (alphaess-net here).
    # A bare `proxy_pass http://controlpanel:5000` resolves the name ONCE, at config load,
    # and then holds that IP for the life of the worker process -- so a controlpanel
    # recreate (the live toggle's own compose call touches other containers too on a
    # `down`/`up`, and any redeploy of controlpanel itself) gets a new container IP that
    # this worker never re-resolves until nginx itself restarts. `resolver` plus a variable
    # in `proxy_pass` forces nginx to re-resolve on every request instead (cached for the
    # `valid` window), which is what an internal service name behind a reverse proxy needs.
    resolver 127.0.0.11 valid=10s;

    location /static/ {
        set $controlpanel_upstream controlpanel:5000;
        proxy_pass http://$controlpanel_upstream;
    }

    location / {
        set $controlpanel_upstream controlpanel:5000;
        proxy_pass http://$controlpanel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Backfills run synchronously and can take up to 30 minutes (see
        # controlpanel/backfill_actions.py); the compose recreate behind the live toggle is
        # much shorter but shares this generous ceiling rather than adding a second one.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
