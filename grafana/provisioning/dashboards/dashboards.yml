apiVersion: 1

providers:
  - name: alphaess
    # Must match the folder named by provisioning/alerting/alphaess-staleness.yml,
    # which Grafana creates for the alert rule. With folder: "" the dashboards
    # landed in the root while that folder held only the alert -- confusing with
    # one project, unusable once a second project's dashboards share the list.
    #
    # Matched by title, so the two files must agree exactly.
    #
    # !! Changing this does NOT move dashboards that already exist. Grafana
    # skips a provisioned dashboard whose checksum is unchanged, and the
    # entrypoint rewrites the JSON byte-identically on every start -- so the
    # files look untouched and the new folder is never applied. Fresh installs
    # land in the folder correctly; existing ones stay where they were, with
    # nothing in the log to say why. Observed on 2026-07-28 upgrading to this
    # setting.
    #
    # Deleting them is not a workaround: Grafana refuses to delete a provisioned
    # dashboard from either the UI or the API. Bump the top-level "version" in
    # each dashboard JSON instead -- that changes the checksum, so the file is
    # processed and lands in this folder. See DEPLOY.md, "If the pull changed
    # the dashboard folder".
    folder: AlphaESS
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

  # Container logs from the whole NAS, not just this project -- so it does not belong in
  # the AlphaESS folder above. Its own provider, its own folder.
  #
  # A SEPARATE PATH FROM THE ONE ABOVE, and not /var/lib/grafana/dashboards. That path is
  # written by the entrypoint's sed loop, which exists only to substitute ${DS_ALPHAESS}
  # in the AlphaESS dashboards. grafana/nas/nas-logs.json names `uid: loki` directly and
  # needs no substitution, so it is bind-mounted read-only straight to where Grafana
  # reads it.
  #
  # The same warning as above applies: changing this file does NOT move dashboards that
  # already exist, and Grafana skips a provisioned dashboard whose checksum is unchanged.
  # Bump the top-level "version" in nas-logs.json to force it to be re-read.
  - name: nas
    folder: NAS
    type: file
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards-nas
