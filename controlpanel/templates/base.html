<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Control panel{% endblock %} - alphaess-collector</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/" class="{{ 'active' if request.path == '/' }}">Dashboard</a>
    <a href="/backfill" class="{{ 'active' if request.path == '/backfill' }}">Backfill</a>
    <a href="/reliability" class="{{ 'active' if request.path == '/reliability' }}">Reliability</a>
    <a href="/audit" class="{{ 'active' if request.path == '/audit' }}">Audit</a>
    <a href="/live" class="live-link {{ 'active' if request.path == '/live' }}">Live toggle</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
