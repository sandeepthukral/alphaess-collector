x-logging: &default-logging
  # All four services log continuously (the collector/pusher every
  # POLL_INTERVAL_SECONDS, forever) and the default json-file driver has no
  # cap of its own -- left alone it's unbounded disk growth on the NAS. Cap
  # and rotate instead.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Container clock, for log timestamps only. Without it every container runs
# UTC while the NAS, Grafana and Uptime Kuma show local time -- so a log line
# and the dashboard row for the same failure are two hours apart in summer,
# which reads as two separate incidents during the one moment you least want
# to be doing arithmetic. Observed 2026-08-04 on a 15-minute AlphaESS outage.
#
# Safe to change: nothing date-sensitive reads the container clock's zone.
# pricing.py and scripts/daily-savings.sh pin Europe/Amsterdam explicitly
# (NL_TZ in collector/prices.py) and InfluxDB stores UTC regardless, so day
# boundaries and published savings are unaffected either way.
x-timezone: &default-timezone
  TZ: ${TZ:-Europe/Amsterdam}

services:
  influxdb:
    image: influxdb:2
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *default-timezone
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-home}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-alphaess}
      DOCKER_INFLUXDB_INIT_RETENTION: "0" # infinite
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    ports:
      - "${INFLUX_PORT:-8086}:8086" # for local inspection of the InfluxDB UI
    volumes:
      - alphaess-influxdb-data:/var/lib/influxdb2
      # Nightly backup target for scripts/backup-influxdb.sh (see
      # BACKUP-DATABASE.MD). Default keeps a non-NAS `docker compose up`
      # working out of the box; the NAS .env overrides it to point at a
      # folder the NAS's own backup tool already watches.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    networks:
      - alphaess-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build: ./collector
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *default-timezone
      ALPHAESS_APP_ID: ${ALPHAESS_APP_ID}
      ALPHAESS_APP_SECRET: ${ALPHAESS_APP_SECRET}
      ALPHAESS_SYS_SN: ${ALPHAESS_SYS_SN}
      INFLUX_URL: http://influxdb:8086
      # Read+write on the alphaess bucket. Read because this image also runs
      # pricing.py, which queries daily_cost to skip days already computed.
      INFLUX_TOKEN: ${INFLUX_TOKEN_COLLECTOR:?set INFLUX_TOKEN_COLLECTOR in .env -- see DEPLOY.md, "Scoped tokens"}
      INFLUX_ORG: ${INFLUX_ORG:-home}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-alphaess}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Battery usable capacity (kWh) — used by pricing.py to express the daily
      # SoC change in kWh. Optional; leave blank to skip that indicator.
      BATTERY_CAPACITY_KWH: ${BATTERY_CAPACITY_KWH:-}
      # Optional Kuma "Push" monitor URL; unset = no heartbeat.
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      # Keep in sync with the com.docker.network.driver.mtu driver_opt on
      # alphaess-net below. The collector warns at startup if the MTU it
      # actually has is larger, which catches the network having been created
      # before that cap was added.
      EXPECTED_MAX_MTU: ${EXPECTED_MAX_MTU:-1400}
      # Ceiling on the exponential backoff between failed polls. Coupled to
      # PRICING_MAX_GAP_S below -- raising one without the other either costs
      # whole days of savings data or hides real outages. See
      # tests/test_collector_backoff.py.
      MAX_BACKOFF_SECONDS: ${MAX_BACKOFF_SECONDS:-120}
      # Reachability probe used to attribute a run of failures to the network
      # or to AlphaESS. An IP, so it does not itself depend on DNS. The default
      # is spelled out rather than left blank because collector.py's env()
      # falls back only on an absent variable, not an empty one.
      DIAGNOSTIC_URL: ${DIAGNOSTIC_URL:-https://1.1.1.1/}
      # Complete-day gates for pricing.py, which runs from this same image via
      # scripts/daily-savings.sh -- so this block is what makes them reachable
      # at all. Defaults match the constants in pricing.py; a day failing
      # either is left out of daily_cost entirely.
      #
      # Use the `:-` form, not a bare `-`: `:-` substitutes on empty as well as
      # unset, so a stray `PRICING_MAX_GAP_S=` line in .env falls back instead
      # of feeding an empty string to float().
      PRICING_MIN_COVERAGE: ${PRICING_MIN_COVERAGE:-0.96}
      PRICING_MAX_GAP_S: ${PRICING_MAX_GAP_S:-1200}
      # Complete-day gates for efficiency.py, which runs from this same image
      # via scripts/daily-efficiency.sh. Same `:-` reasoning as above.
      # EFFICIENCY_MAX_SOC_ALIGN_PP guards the one assumption efficiency.py
      # cannot verify from the payload: that AlphaESS stamps uploadTime in the
      # system's local zone. A whole-hour error moves SoC by tens of points,
      # so this catches a DST mis-parse instead of storing a plausible lie.
      EFFICIENCY_MIN_COVERAGE: ${EFFICIENCY_MIN_COVERAGE:-0.98}
      EFFICIENCY_MAX_GAP_S: ${EFFICIENCY_MAX_GAP_S:-1800}
      EFFICIENCY_MAX_SOC_ALIGN_PP: ${EFFICIENCY_MAX_SOC_ALIGN_PP:-2.0}
      # Despiking for the metered load series. AlphaESS intermittently returns
      # a wildly wrong single 5-minute `load` record (5832 W where the 30 s
      # series says ~500 W); 14 landed on 2026-08-01 and took that day's
      # conversion loss to -4.59 kWh. A record is dropped when it exceeds the
      # largest derived load in its own 5-minute neighbourhood by both FACTOR x
      # and FLOOR_W -- conversion loss only ever makes derived >= metered, so
      # the reverse by several-fold is not loss. A real appliance spike shows in
      # both series and survives. FACTOR=0 disables.
      EFFICIENCY_SPIKE_FACTOR: ${EFFICIENCY_SPIKE_FACTOR:-4.0}
      EFFICIENCY_SPIKE_FLOOR_W: ${EFFICIENCY_SPIKE_FLOOR_W:-1500}
      EFFICIENCY_MAX_SPIKE_FRACTION: ${EFFICIENCY_MAX_SPIKE_FRACTION:-0.10}
      # AlphaESS rate-limit politeness. efficiency.py shares an appId budget
      # with the 30s poll loop in this same image, so a greedy backfill punches
      # gaps in power_readings that pricing.py then charges against
      # PRICING_MAX_GAP_S. 10s is the upstream library's advice.
      ALPHAESS_MIN_REQUEST_INTERVAL_S: ${ALPHAESS_MIN_REQUEST_INTERVAL_S:-10}
      ALPHAESS_MAX_RETRIES: ${ALPHAESS_MAX_RETRIES:-4}
      ALPHAESS_RETRY_CODES: ${ALPHAESS_RETRY_CODES:-6053}
      # Optional Kuma "Push" monitor URL for the nightly efficiency job; unset =
      # no heartbeat. Separate from HEARTBEAT_URL above: that one is the live
      # collector's dead-man's switch and fires every 30s, this one once a night.
      EFFICIENCY_HEARTBEAT_URL: ${EFFICIENCY_HEARTBEAT_URL:-}
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - alphaess-net
    # Without this the container inherits the NAS's own resolver, and that is
    # what actually broke on 2026-08-24: two outages of 25 and 45 minutes,
    # plus half a dozen one-minute blips through the same evening, every one
    # of them `NameResolutionError` on openapi.alphaess.com -- DNS failing to
    # resolve, not AlphaESS's API timing out or refusing. `diagnose_network()`
    # in collector.py already has a name for this case, "local-dns", and would
    # have returned it for both outages. Pinned to the same resolver
    # DIAGNOSTIC_URL above already trusts for a DNS-independent reachability
    # probe, plus a second provider so one resolver having a bad day does not
    # reproduce the exact failure this is meant to fix.
    dns:
      - 1.1.1.1
      - 8.8.8.8

  awtrix-pusher:
    build: ./awtrix-pusher
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *default-timezone
      INFLUX_URL: http://influxdb:8086
      # Read-only: the pusher only ever reads the newest sample.
      INFLUX_TOKEN: ${INFLUX_TOKEN_PUSHER:?set INFLUX_TOKEN_PUSHER in .env -- see DEPLOY.md, "Scoped tokens"}
      INFLUX_ORG: ${INFLUX_ORG:-home}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-alphaess}
      AWTRIX_HOST: ${AWTRIX_HOST}
      PUSH_INTERVAL_SECONDS: ${PUSH_INTERVAL_SECONDS:-30}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-180}
      # HTTP timeout per request to the clock. Only worth raising if the device
      # is on a slow or congested LAN segment.
      AWTRIX_TIMEOUT_SECONDS: ${AWTRIX_TIMEOUT_SECONDS:-5}
      AWTRIX_ICON_SOC: ${AWTRIX_ICON_SOC:-}
      AWTRIX_ICON_PV: ${AWTRIX_ICON_PV:-}
      AWTRIX_ICON_GRID: ${AWTRIX_ICON_GRID:-}
      AWTRIX_ICON_LOAD: ${AWTRIX_ICON_LOAD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - alphaess-net

  # Modbus dispatch. DESIGN-dispatch.md sections 5 and 10.
  #
  # EXACTLY ONE CONTAINER MAY EVER RUN THIS. The inverter accepts a single Modbus TCP
  # connection and this service holds it for its whole life, so there is no scaling, no second
  # replica, and nothing else on the host may open 192.168.68.151:502 -- not a debug script,
  # not a Kuma TCP port monitor (section 6.2).
  #
  # Starts in DRY RUN: `DISPATCH_LIVE` is unset, so the loop reads the inverter, decides, logs
  # and publishes, and writes nothing. Going live is `DISPATCH_LIVE=1` in `.env` followed by a
  # restart -- an operator action taken while watching the dashboard, per the plan's
  # verification step 6, and step 7 first: the AlphaESS app's own price control must be off, or
  # two controllers fight over the same registers.
  #
  # A SETTING RATHER THAN AN EDIT HERE, deliberately. This file is tracked, and
  # `tests/test_dispatch_deployment.py` asserts it never carries `--live` -- so going live by
  # editing the `command:` below would red the suite on every branch afterwards until somebody
  # weakened the guard, which is precisely the guard worth keeping. `entrypoint.sh` appends the
  # flag; it cannot be passed through `command:` because an empty compose variable arrives as a
  # positional argument and argparse exits 2 before the loop starts.
  #
  # Deploy with `sudo docker compose up -d dispatch`. Two things in that line, both
  # learned the hard way: docker on the Synology needs `sudo`, and a bare `up -d` recreates
  # the collector, which cost 922 s of samples on 2026-08-10.
  dispatch:
    build: ./dispatch
    restart: unless-stopped
    logging: *default-logging
    # THE KILL SWITCH NEEDS LONGER THAN DOCKER'S DEFAULT 10 s.
    #
    # `docker compose stop dispatch` is the primary way to stop a command that is doing the
    # wrong thing, and it works by SIGTERM: the loop breaks and `finally:` runs
    # `inv.release()`, which writes REG_START=0 and hands the battery straight back to
    # self-consumption (`scheduler.py`, section 8).
    #
    # That release is a Modbus write, and the case where you most want to stop the dispatcher
    # is exactly the case where the inverter is slow to answer -- pymodbus spends 3 s x 3
    # retries, about 12 s, before it gives up. Longer than the default grace period, so
    # Docker would SIGKILL the process mid-release and the last command would stay live until
    # its 300 s dead man's switch expired. The backstop works; it is five minutes slower than
    # the button you just pressed, which is the wrong five minutes.
    #
    # 30 s covers a full retry ladder plus the client close with room to spare, and costs
    # nothing on a healthy stop, which returns in well under a second.
    stop_grace_period: 30s
    command: ["--ip", "${INVERTER_IP:-192.168.68.151}"]
    environment:
      <<: *default-timezone
      # Unset or 0 = dry run. This is the go-live switch; see the comment above the service.
      DISPATCH_LIVE: ${DISPATCH_LIVE:-0}
      INFLUX_URL: http://influxdb:8086
      # Read on `planning` (the plan the translator consumes) and write on `alphaess` (the
      # dispatch_state readback behind section 7's panels). A separate token from the
      # collector's: this is the only process in the stack that needs to read another
      # project's bucket. Mint per DEPLOY.md, "Scoped tokens".
      INFLUX_TOKEN: ${INFLUX_TOKEN_DISPATCH:?set INFLUX_TOKEN_DISPATCH in .env -- see DEPLOY.md, "Scoped tokens"}
      INFLUX_ORG: ${INFLUX_ORG:-home}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-alphaess}
      PLANNING_BUCKET: ${PLANNING_BUCKET:-planning}
      # Tags dispatch_state so the panels can sit beside the collector's series.
      ALPHAESS_SYS_SN: ${ALPHAESS_SYS_SN}
      # Usable capacity in Wh, used to turn the plan's Wh-per-interval into a target SoC.
      # Duplicated with battery-planning/hardware.py until PLAN-repo-seams.md section 2a
      # publishes it on the plan itself. 27,900 is the COMMANDABLE capacity and is not
      # expected to change; the ~30,500 Wh in hardware.py is headroom the pack only reaches
      # after a long hold at 100 %, deliberately unmodelled (DESIGN-dispatch.md section 4.1).
      # If this number ever does change, both copies have to change on the same day or the
      # two halves disagree about what 100 % means.
      BATTERY_CAPACITY_WH: ${BATTERY_CAPACITY_WH:-27900}
      # How often the translator re-reads the plan -- see dispatch/entrypoint.sh for why five
      # minutes and not an hour. At 3600 this ran a measured 46 minutes behind the planner and
      # a plan could expire before it was ever read (2026-08-19).
      TRANSLATE_INTERVAL_S: ${TRANSLATE_INTERVAL_S:-300}
      # Kuma push URLs, section 6.1. Unset = no heartbeat, which is the right default for a
      # dry run and the wrong one once this is live: DISPATCH-GOLIVE.md section 3 creates all
      # seven and confirms each goes green before `--live` is added.
      #
      # #2 and #3 are pinged by the translator, around a batch job that runs hourly.
      PLAN_INFLUX_HEARTBEAT_URL: ${PLAN_INFLUX_HEARTBEAT_URL:-}
      SLOTS_WRITTEN_HEARTBEAT_URL: ${SLOTS_WRITTEN_HEARTBEAT_URL:-}
      # #4-#8 are pinged by the control loop, every tick. Note that #5's Kuma interval must
      # stay above the 60 s loop interval or it flaps on a single slow tick.
      SLOTS_FRESH_HEARTBEAT_URL: ${SLOTS_FRESH_HEARTBEAT_URL:-}
      DISPATCHER_ALIVE_HEARTBEAT_URL: ${DISPATCHER_ALIVE_HEARTBEAT_URL:-}
      DISPATCH_CONFIRMED_HEARTBEAT_URL: ${DISPATCH_CONFIRMED_HEARTBEAT_URL:-}
      INVERTER_NOT_HIJACKED_HEARTBEAT_URL: ${INVERTER_NOT_HIJACKED_HEARTBEAT_URL:-}
      SOC_FLOOR_HEARTBEAT_URL: ${SOC_FLOOR_HEARTBEAT_URL:-}
      # The floor monitor #8 reports against. Matches the planner's `minBatterySOCPct`; it is
      # a backstop, not a control input -- nothing refuses a command because of it.
      SOC_FLOOR_PCT: ${SOC_FLOOR_PCT:-10}
    volumes:
      # slots.json, the heartbeat file and the audit log. On a volume rather than in the image
      # so a rebuild does not discard the schedule the battery is currently following.
      - alphaess-dispatch-data:/data
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - alphaess-net

  grafana:
    image: grafana/grafana-oss:11.6.0
    restart: unless-stopped
    logging: *default-logging
    # Copies the dashboard JSON into the provisioning dir with the import
    # placeholder ${DS_ALPHAESS} resolved to the provisioned datasource uid,
    # then starts Grafana normally. Keeps grafana/alphaess-dashboard.json
    # import-compatible for setups with an existing Grafana (see DEPLOY.md).
    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p /var/lib/grafana/dashboards &&
        for f in /etc/grafana/dashboard-src/*.json; do
        sed 's/$${DS_ALPHAESS}/alphaess/g' "$$f"
        > /var/lib/grafana/dashboards/"$$(basename "$$f")";
        done &&
        exec /run.sh
    environment:
      <<: *default-timezone
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # No fallback, on purpose. Grafana is the only service published to the
      # LAN, its admin account guards more than one project's dashboards, and
      # the datasource proxy behind it will issue arbitrary Flux against every
      # bucket the token can read. A `:-admin` default meant a missing or
      # misspelled .env key came up quietly reachable with admin/admin instead
      # of failing.
      #
      # Only takes effect when Grafana first initialises its database; see
      # DEPLOY.md, "Changing the Grafana admin password" to change it later.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env -- no default, see DEPLOY.md, "Transfer secrets"}
      # ECharts panel used by the Energy Flow (Sankey) dashboard (not in core Grafana).
      # Deliberately unpinned. A `@7.2.2` pin was tried (7.2.4+ need Grafana
      # >=12.3.0, this stack runs 11.6.0) and it crash-looped Grafana on a fresh
      # install: GCOM's plugin API 404s when the entrypoint requests that exact
      # pinned version, even though the version itself is real and compatible
      # -- the unpinned path (fetch "latest" metadata, which the plugin's own
      # compatibility check then filters) is the one that actually works
      # against this Grafana version. Confirmed on the NAS 2026-07-31.
      GF_INSTALL_PLUGINS: volkovlabs-echarts-panel
      # Consumed by grafana/provisioning/datasources/influxdb.yml.
      # Read-only, across every bucket Grafana must chart. Anyone reaching the
      # Grafana UI can issue arbitrary Flux through the datasource proxy.
      INFLUX_TOKEN: ${INFLUX_TOKEN_GRAFANA:?set INFLUX_TOKEN_GRAFANA in .env -- see DEPLOY.md, "Scoped tokens"}
      INFLUX_ORG: ${INFLUX_ORG:-home}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-alphaess}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - alphaess-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/alphaess-dashboard.json:/etc/grafana/dashboard-src/alphaess-dashboard.json:ro
      - ./grafana/alphaess-energy-flow.json:/etc/grafana/dashboard-src/alphaess-energy-flow.json:ro
      - ./grafana/alphaess-battery-savings.json:/etc/grafana/dashboard-src/alphaess-battery-savings.json:ro
      # "Energy" holds the daily/hourly detail the main dashboard used to carry: the
      # per-day stats, both bar charts and both tables. The main dashboard keeps what is
      # true right now -- SoC, battery power, collector status, the Sankey and the two
      # timeseries -- so neither has to be scrolled to answer its own question.
      - ./grafana/alphaess-energy.json:/etc/grafana/dashboard-src/alphaess-energy.json:ro
      - ./grafana/alphaess-collector-health.json:/etc/grafana/dashboard-src/alphaess-collector-health.json:ro
      - ./grafana/alphaess-energy-losses.json:/etc/grafana/dashboard-src/alphaess-energy-losses.json:ro
      # Both read the `planning` bucket, which the battery-planning repo writes to. The
      # datasource points at `alphaess` as its default bucket, but every query here names its
      # bucket explicitly, so one datasource serves both. That does depend on
      # INFLUX_TOKEN_GRAFANA being scoped `r alphaess, r planning`, as DEPLOY.md, "Scoped
      # tokens" creates it -- a token reading only alphaess leaves every panel on these two
      # dashboards empty.
      #
      # The pair points in opposite directions: -plan reads the `plan` measurement and looks
      # forward 36 hours, -score reads `plan_score` and looks back over finished days.
      - ./grafana/alphaess-battery-plan.json:/etc/grafana/dashboard-src/alphaess-battery-plan.json:ro
      - ./grafana/alphaess-dispatch.json:/etc/grafana/dashboard-src/alphaess-dispatch.json:ro
      - ./grafana/alphaess-battery-score.json:/etc/grafana/dashboard-src/alphaess-battery-score.json:ro
      - ./grafana/alphaess-battery-health.json:/etc/grafana/dashboard-src/alphaess-battery-health.json:ro
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - alphaess-net
    healthcheck:
      # Catches a crash-looping container (e.g. the GF_INSTALL_PLUGINS pin
      # that 404'd against a fresh volume, see the #9 notes in
      # CODE-REVIEW.md) in `docker compose ps` instead of needing someone to
      # read logs to notice.
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  alphaess-net:
    # Pinned rather than left to Compose, which would derive it from the
    # directory name (alphaess-collector_alphaess-net) and change it if this
    # checkout were ever renamed or cloned elsewhere. Other compose projects on
    # the same host join this network by name as `external: true`, so the name
    # is a published interface -- see DEPLOY.md, "Sharing the stack".
    #
    # Joining it is also what confers the MTU cap below.
    name: alphaess-net
    # Cap the bridge MTU to clear path-MTU limits on some hosts (e.g. Synology
    # NAS uplinks / VPN/PPPoE), where the default 1500 causes large TLS
    # handshake packets to the AlphaESS API to be dropped, surfacing as
    # intermittent "SSL: UNEXPECTED_EOF_WHILE_READING" errors in the collector.
    #
    # !! Changing anything under driver_opts requires `docker compose down`
    # followed by `up -d`. Compose only applies driver_opts when it CREATES a
    # network; if one with this name already exists it is reused as-is and
    # your edit is silently ignored -- no warning, no error. `up
    # --force-recreate` does NOT help: it recreates the container but
    # reattaches it to the existing network. Verify with
    #   docker compose exec collector cat /sys/class/net/eth0/mtu
    # The collector also logs its link MTU at startup and warns if it exceeds
    # EXPECTED_MAX_MTU (see collector/collector.py:check_mtu).
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  alphaess-influxdb-data:
  alphaess-grafana-data:
  alphaess-dispatch-data:
