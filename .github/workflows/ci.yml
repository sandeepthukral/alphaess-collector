name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the python:3.12-slim base image the services are built on, so
          # CI cannot pass on a version the containers never run.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check collector awtrix-pusher tests

      - name: Test
        run: pytest

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches YAML errors and unresolved interpolations in docker-compose.yml
      # without building anything. .env is gitignored, so supply the example.
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
